<!doctype html>
<!-- ต้นฉบับภาพแชร์ (public/og-image.png 1200×630) — แก้แล้ว render ใหม่ด้วย headless Chrome ขนาด 1200×630 -->
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@500&family=IBM+Plex+Mono:wght@500&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box; position: relative;
    color: #f2f6ff; padding: 64px 72px 0; font-family: "IBM Plex Sans Thai", sans-serif;
    display: grid; grid-template-rows: auto 1fr;
    background:
      radial-gradient(ellipse 700px 520px at 0% -10%, rgba(75, 85, 206, .45), transparent 70%),
      radial-gradient(ellipse 700px 600px at 100% 0%, rgba(22, 166, 175, .25), transparent 72%),
      #070b16;
  }
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(153, 176, 227, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(153, 176, 227, .05) 1px, transparent 1px);
    background-size: 45px 45px;
  }
  .top { position: relative; display: flex; align-items: center; gap: 36px; }
  .logo { width: 150px; height: 150px; flex: none; border-radius: 38px; box-shadow: 0 18px 50px rgba(81, 99, 232, .45); }
  .over { font: 600 20px "IBM Plex Mono", monospace; letter-spacing: .25em; color: #8c9dff; }
  h1 { font: 700 124px/1 "Chakra Petch", sans-serif; margin: 26px 0 0; letter-spacing: -.03em; }
  .sub { font-size: 38px; color: #c9d3ea; margin-top: 12px; }
  .stats { font: 500 25px "IBM Plex Mono", "IBM Plex Sans Thai", monospace; color: #9caac3; margin-top: 8px; }
  .face {
    position: relative; align-self: end; margin: 0 -72px; height: 190px;
    background: linear-gradient(120deg, #1b2441, #101c32); border-top: 1px solid rgba(156, 173, 255, .3); color: #a6b4d3;
  }
  .scale { position: absolute; left: 72px; right: 72px; top: 92px; height: 0; border-top: 2px solid rgba(183, 207, 255, .45); }
  .tick { position: absolute; bottom: 0; width: 2px; background: #91a2c8; }
  .tick.major { height: 30px; } .tick.minor { height: 14px; opacity: .55; }
  .num { position: absolute; top: 14px; transform: translateX(-50%); font: 500 24px "IBM Plex Mono", monospace; }
  .needle { position: absolute; top: 18px; bottom: 30px; width: 6px; margin-left: -3px; background: #65e4e1; border-radius: 3px; box-shadow: 0 0 22px #65e4e1; }
  .needle::after { content: ""; position: absolute; top: -10px; left: -7px; width: 20px; height: 20px; border-radius: 50%; background: #65e4e1; box-shadow: 0 0 22px #65e4e1; }
  .readout { position: absolute; right: 72px; top: -112px; font: 600 80px "Chakra Petch", sans-serif; letter-spacing: -.04em; color: #f2f6ff; text-shadow: 0 0 30px rgba(124, 149, 255, .5); }
  .readout span { font: 600 24px "IBM Plex Mono", monospace; margin-left: 10px; color: #92a8e2; letter-spacing: 0; }
</style>
</head>
<body>
  <div class="top">
    <img class="logo" src="../public/favicon.svg" alt="">
    <div>
      <div class="over">WORLD RADIO</div>
      <h1>คลื่นไทย</h1>
      <div class="sub">ฟังวิทยุออนไลน์ฟรี จากทุกประเทศทั่วโลก</div>
      <div class="stats">60,000+ สถานี · 200+ ประเทศ</div>
    </div>
  </div>
  <div class="face">
    <div class="readout">93.0<span>MHz</span></div>
    <div class="scale" id="scale"></div>
  </div>
<script>
  const MIN = 87.5, MAX = 108, pct = (f) => ((f - MIN) / (MAX - MIN)) * 100;
  const scale = document.getElementById('scale');
  for (let f = 88; f <= 108; f += 0.5) {
    const major = f % 2 === 0;
    scale.insertAdjacentHTML('beforeend', `<div class="tick ${major ? 'major' : 'minor'}" style="left:${pct(f)}%"></div>`);
    if (major) scale.insertAdjacentHTML('beforeend', `<div class="num" style="left:${pct(f)}%">${f}</div>`);
  }
  const needle = document.createElement('div');
  needle.className = 'needle';
  needle.style.left = `calc(72px + (100% - 144px) * ${pct(93) / 100})`;
  document.querySelector('.face').append(needle);
</script>
</body>
</html>
