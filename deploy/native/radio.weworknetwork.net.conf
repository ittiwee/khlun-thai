# nginx site ของคลื่นไทย (deploy แบบไม่ใช้ Docker) — หน้าเว็บจาก dist/ และ /stream/ ส่งต่อให้ proxy ที่ 127.0.0.1:3010
# ติดตั้ง: cp เป็น /etc/nginx/sites-available/radio.weworknetwork.net แล้ว ln -s ไปที่ sites-enabled
# ถ้าใช้โดเมนอื่น แก้ server_name และ path ของ certificate

server {
    listen 80;
    server_name radio.weworknetwork.net;

    # ACME HTTP-01 (certbot --webroot -w /var/www/html)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name radio.weworknetwork.net;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/radio.weworknetwork.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.weworknetwork.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /opt/khlun-thai/dist;

    # add_header ใน location แทนที่ของ server ทั้งหมด — location ที่มี add_header ของตัวเองจึงต้องใส่ซ้ำ
    set $hsts "max-age=63072000";
    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /stream/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # เขียนทับด้วย IP ที่ nginx เห็น — client ปลอม X-Forwarded-For ไม่ได้ (proxy เชื่อเฉพาะ 127.0.0.1)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3010;
    }

    # ไฟล์ที่มี hash ในชื่อ cache ได้ยาว
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # service worker และหน้าหลักต้องได้ตัวใหม่เสมอ
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;
}
