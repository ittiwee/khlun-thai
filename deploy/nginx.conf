# เสิร์ฟหน้าเว็บ (dist/) และส่ง /stream/ ต่อให้ proxy
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # มี reverse proxy อีกชั้นข้างหน้า (Cloudflare Tunnel, Caddy ฯลฯ)? เปิด 3 บรรทัดนี้แล้วใส่ IP/CIDR ของตัวกลาง
    # ไม่อย่างนั้น proxy จะเห็นผู้ใช้ทุกคนเป็น IP เดียวกันและใช้โควตาต่อ IP ร่วมกัน
    # set_real_ip_from 172.16.0.0/12;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # resolve ชื่อ "proxy" ใหม่ทุก 30 วินาที (container restart แล้ว IP เปลี่ยนก็ยังใช้ได้)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $proxy_upstream http://proxy:3000;

    location /stream/ {
        proxy_pass $proxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # เขียนทับด้วย IP ที่ nginx เห็น (ไม่ต่อท้ายค่าที่ client ส่งมา) — client ปลอม X-Forwarded-For ไม่ได้
        # ถ้าเปิด real_ip ด้านบน $remote_addr จะเป็น IP จริงของผู้ใช้ที่ผ่านตัวกลางมาแล้ว
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz {
        proxy_pass $proxy_upstream;
        allow 127.0.0.1;
        deny all;
    }

    # ไฟล์ที่มี hash ในชื่อ cache ได้ยาว
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # service worker และหน้าหลักต้องได้ตัวใหม่เสมอ
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/json;
}
